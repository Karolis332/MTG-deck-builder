name: Secret Scan (gitleaks)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan repo (current state)
        run: gitleaks detect --source . --no-git --redact --verbose --report-format sarif --report-path gitleaks.sarif
        continue-on-error: true
      - name: Scan git history
        run: gitleaks detect --source . --redact --verbose --exit-code 1 --report-format sarif --report-path gitleaks-history.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-history.sarif
          category: gitleaks
